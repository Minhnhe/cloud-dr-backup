name: MongoDB Automated Backup

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"


jobs:

  backup:

    runs-on: ubuntu-24.04

    steps:

      # ======================================
      # 1. CHECKOUT CODE
      # ======================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================
      # 2. SETUP PYTHON
      # ======================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ======================================
      # 3. INSTALL PYTHON DEPENDENCIES
      # ======================================

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ======================================
      # 4. INSTALL OPENSSL
      # ======================================

      - name: Install OpenSSL
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl


      # ======================================
      # 5. INSTALL MONGODB DATABASE TOOLS
      # ======================================

      - name: Install MongoDB Database Tools
        run: |
          wget -q https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2404-x86_64-100.18.0.deb
          sudo dpkg -i mongodb-database-tools-ubuntu2404-x86_64-100.18.0.deb


      # ======================================
      # 6. KIỂM TRA CÔNG CỤ
      # ======================================

      - name: Verify tools
        run: |
          mongodump --version
          openssl version
          python --version


      # ======================================
      # 7. CHẠY MONGODB AUTOMATED BACKUP
      # ======================================

      - name: Run MongoDB backup
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          python scripts/backup_mongodb.py


      # ======================================
      # 8. LƯU BACKUP
      # ======================================

      - name: Upload encrypted backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: mongodb-backup-${{ github.run_number }}
          path: backup/*.enc
          retention-days: 7