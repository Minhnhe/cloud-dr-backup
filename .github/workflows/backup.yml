name: MongoDB Automated Backup

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  backup:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl gzip wget

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install boto3

      - name: Install MongoDB Database Tools
        run: |
          wget -q https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2404-x86_64-100.18.0.deb
          sudo dpkg -i mongodb-database-tools-ubuntu2404-x86_64-100.18.0.deb

      - name: Verify tools
        run: |
          mongodump --version
          openssl version
          gzip --version
          python --version

      - name: Verify AWS
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-southeast-2
          AWS_REGION: ap-southeast-2
        run: |
          python -c "import boto3; s=boto3.Session(); print('AWS Region:', s.region_name); print('S3 endpoint:', s.client('s3').meta.endpoint_url)"

      - name: Run MongoDB backup
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-southeast-2
          AWS_REGION: ap-southeast-2
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          python scripts/backup_mongodb.py
