name: MongoDB Automated Backup

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

jobs:

  backup:

    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      - name: Install Python dependencies
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      - name: Install OpenSSL
        run: |

          sudo apt-get update

          sudo apt-get install -y openssl


      - name: Install MongoDB Database Tools
        run: |

          wget -q https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2404-x86_64-100.18.0.deb

          sudo dpkg -i mongodb-database-tools-ubuntu2404-x86_64-100.18.0.deb


      - name: Verify MongoDB tools
        run: |

          mongodump --version

          openssl version


      - name: Run MongoDB backup
        env:

          MONGODB_URI: ${{ secrets.MONGODB_URI }}

          S3_BUCKET: ${{ secrets.S3_BUCKET }}

          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}

          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

          AWS_REGION: ${{ secrets.AWS_REGION }}

          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}

        run: |

          python scripts/backup_mongodb.py